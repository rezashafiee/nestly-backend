services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: nestly
      MYSQL_USER: nestly
      MYSQL_PASSWORD: nestly
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-unestly", "-pnestly"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  api:
    build: .
    environment:
      DB_URL: jdbc:mysql://mysql:3306/nestly?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USER: nestly
      DB_PASSWORD: nestly
      CORS_ALLOWED_ORIGINS: "*"
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql-data:
