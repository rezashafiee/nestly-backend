server:
  port: ${PORT:8080}

spring:
  application:
    name: nestly-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/nestly?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USER:nestly}
    password: ${DB_PASSWORD:nestly}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
  jackson:
    serialization:
      write-dates-as-timestamps: false
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
